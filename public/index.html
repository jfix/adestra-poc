<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter sign-up</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <form id="signup">
    <label for="email">Email address</label>
    <div class="row">
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
      <button type="submit">Subscribe</button>
    </div>
  </form>
  <div id="result" role="status" aria-live="polite" hidden>
    <p id="message"></p>
    <button id="retry" type="button" hidden>Try again</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
